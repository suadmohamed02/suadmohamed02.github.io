# ============================================================
#  ⭐  YOUR WEBSITE SETTINGS  ⭐
#
#  This is the only file you need to edit to build your site.
#  Change the text between the quote marks, save (commit), and
#  your website rebuilds itself automatically in a minute or two.
#
#  RULES OF THUMB
#  • Keep the quote marks: name = "Your Name"
#  • Lines starting with # are notes — the computer ignores them.
#  • To skip an option, leave it empty ("") or put a # at the beginning of that line.
#  • Full instructions live in the README file.
# ============================================================


# ── Who you are ─────────────────────────────────────────────

name = "Suad Mohamed"                # ← Required. Everything else is optional.

# A short phrase describing you. Shows up big at the top of most templates.
#tagline = "Multimedia Journalist"

location = "Berkeley, California"

# ── For search engines only (optional) ──────────────────────
#
# These two lines never show up anywhere on your website. They
# are tucked invisibly into the page so Google, and the AI tools
# that read the web, can tell who you are and where you work.
# Fill them in if they apply to you. If not, leave them empty.

job_title = "Multimedia Journalist"     # Your role, like "Reporter" or "Photojournalist"
employer = "Emeryville Today"      # Where you work, intern, or freelance most

# ── The look of your site ───────────────────────────────────
#
# Pick one template (see the README for pictures of each):
#   "marquee"    – bold black-and-white with a huge headline
#   "editorial"  – elegant magazine-style serif type
#   "byline"     – minimal and airy, centered text
#   "ivory"      – soft ivory and navy, quiet and refined
#   "bloom"      – warm pastel colors, friendly and rounded
#   "newsprint"  – classic newspaper look on warm paper
#   "signal"     – huge bold headline, then a bright yellow band
#   "harbor"     – deep teal with a portrait sidebar and serif type

template = "editorial"

# ── How people reach you ────────────────────────────────────

email = "suadmohamed@berkeley.edu"
phone = ""                          # e.g. "(510) 555-0123" — or leave empty

# Paste any social media links here, one per line between the brackets.
# The right icon appears automatically.
socials = [
  "https://www.instagram.com/example",
  "linkedin.com/in/suad-mohamed-a35779230",
  "https://bsky.app/profile/example.bsky.social",
]

# ── Photos and files ────────────────────────────────────────
#
# Upload files to the "media" folder on GitHub, then write the
# file's name here.

banner_photo = "media/suadheadshot.jpg"   # A portrait or banner photo of you
resume = ""         # A PDF of your resume (adds a Resume button)
favicon = ""                        # Tiny browser-tab icon. Empty = made for you

# ── About you ───────────────────────────────────────────────
#
# Your bio. Keep the three quote marks (""") on their own lines.
# A blank line starts a new paragraph.

bio = """

Hello, my name is Suad and I'm a graduate journalism student at UC Berkeley with a 
focus on multimedia story telling. I grew up in West London and have always been
passionate about telling stories that reflect society and spark meaningful conversations.

My work focuses on identity, representation and lived experience. I draw from a 
strong documentary foundation that shapes my approach across all formats. I hold a B.A
in Television, Film & New Media Production from San Diego State University, with a 
minor in Journalism and a specialization in Digital and Social Media Studies. 



"""

# Optional extra line at the bottom of every page.
footer = ""


# ============================================================
#  YOUR PORTFOLIO
#
#  Each piece of work starts with [[work]] on its own line.
#  Copy a whole block to add a new one. Every line inside a
#  block is optional — leave out what you don't have.
#
#  "category" groups similar work together on the page and in
#  the menu. Give works the same category name to group them.
#
#  "outlet" is optional and never appears on your site. It tells
#  search engines which publication ran the piece, which helps
#  connect your name to your byline elsewhere on the web.
# ============================================================

# ── Published stories: give them a url and they link out ────

[[work]]
title = "City Council approves protected bike lanes for Telegraph Avenue"
description = "After a decade of debate and three hours of public comment, Berkeley's City Council voted 7–2 to build protected bike lanes along one of the city's busiest corridors."
url = "https://example.com/your-story-link-goes-here"
image = "media/work/bike-lanes.jpg"
date = "March 2026"
category = "Journalism"
outlet = "Berkeleyside"

# This one has no image on purpose — the site still handles it gracefully.


