[[work]]
title = "Saturday at the farmers market"
description = "Scenes from a morning at the downtown farmers market, where vendors set up before sunrise and regulars arrive with the same canvas bags every week."
date = "February 2026"
category = "Photojournalism"
photos = [
  "media/farmers-market/01-market-opening.jpg | Produce stands catch the first light as the market opens at 8 a.m.",
